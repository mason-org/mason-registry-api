---
name: Schema tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: 0 8 * * *

jobs:
  schema-test:
    name: Run schema tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:skip-schema-tests')) }}

    steps:
      - uses: actions/checkout@v6
      - uses: amondnet/vercel-action@v42
        if: ${{ github.event_name == 'pull_request' }}
        id: deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      - name: Run schema tests
        run: |
          npm install -g ajv ajv-cli ajv-formats
          ./tests/validate-schema.sh
        env:
          GITHUB_API_KEY: ${{ secrets.PAT }}
          BASE_URL: ${{ steps.deploy.outputs.preview-url }}
